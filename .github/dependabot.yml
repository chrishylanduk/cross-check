version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    # Applies to routine version updates only; security fixes are not delayed.
    cooldown:
      default-days: 7
    # Disable routine version updates while allowing security update PRs.
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    # Include transitive dependencies such as urllib3 and virtualenv.
    allow:
      - dependency-type: all
    groups:
      python-dependencies:
        patterns:
          - "*"
